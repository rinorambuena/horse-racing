<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carrera de Caballos</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Simulador de carrera de caballos</h2>

    <div class="controls">
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="horse-count">Caballos:</label>
        <select id="horse-count">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4" selected>4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <label for="speed-slider">Velocidad:</label>
        <input
          type="range"
          id="speed-slider"
          min="1"
          max="5"
          step="1"
          value="3"
          style="width: 80px"
        />
        <span id="speed-label">Normal</span>
      </div>
      <div style="flex-grow: 1">
        <button class="primary" onclick="startRace()">Iniciar</button>
        <button class="secondary" onclick="resetRace()">Reiniciar</button>
      </div>
    </div>

    <details class="bulk-input">
      <summary>Carga rápida de nombres</summary>
      <div class="bulk-row">
        <input type="text" id="bulk-names" placeholder="Relampago;Tornado;Veloz;Furia" />
        <button onclick="bulkLoadNames(document.getElementById('bulk-names').value)">Cargar</button>
      </div>
    </details>

    <details class="bulk-input">
      <summary>Eventos externos</summary>
      <div class="bulk-row">
        <label class="event-toggle">
          <input type="checkbox" id="heart-attack-enabled" />
          💔 Infartos
        </label>
        <input
          type="range"
          id="heart-attack-chance"
          min="0"
          max="100"
          step="5"
          value="33"
          style="width: 120px"
          disabled
        />
        <span id="heart-attack-label" class="event-label">33%</span>
      </div>
    </details>

    <div class="config-panel">
      <h3>Personalizar caballos</h3>
      <div id="config-panel"></div>
    </div>

    <div id="tracks" class="track-container"></div>

    <div class="status-bar">
      <span class="status-msg" id="status-msg"
        >Configura y presiona Iniciar para arrancar la carrera.</span
      >
    </div>

    <div id="podium" class="podium">
      <h3>Resultados</h3>
      <div class="podium-list" id="podium-list"></div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/state.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/race.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
